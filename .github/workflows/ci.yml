name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test price handling and installer
        run: python -m unittest discover -s tests -v
      - name: Validate Python and shell syntax
        run: |
          python -m compileall -q tracker.py scripts tests
          bash -n install.sh uninstall.sh
  extension:
    name: GNOME data and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install GJS
        run: sudo apt-get update && sudo apt-get install -y gjs
      - name: Test extension data handling
        run: gjs -m tests/test_data.js
      - name: Build GNOME extension
        run: python3 scripts/package.py

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <title>BTC/USD Tracker presentation backdrop</title>
  <desc>A plum and orange desktop backdrop with introductory copy. The real GNOME panel and tracker popover are captured over it for the README showcase.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#211226"/><stop offset=".55" stop-color="#33182f"/><stop offset="1" stop-color="#5a2032"/>
    </linearGradient>
    <radialGradient id="warm" cx="0" cy="1" r="1">
      <stop stop-color="#e95420" stop-opacity=".42"/><stop offset="1" stop-color="#e95420" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#e95420" stop-opacity=".20"/><stop offset="1" stop-color="#ad64a8" stop-opacity=".05"/>
    </linearGradient>
    <style>text{font-family:Ubuntu,Arial,sans-serif;fill:#faf6fa}.muted{fill:#cbbac9}.accent{fill:#ffb465}</style>
  </defs>
  <rect width="1280" height="720" fill="url(#base)"/>
  <rect width="1280" height="720" fill="url(#warm)"/>
  <path d="M-160 710C250 510 460 780 950 80L1280 0V720Z" fill="url(#ribbon)"/>
  <path d="M-160 710C250 510 460 780 950 80" fill="none" stroke="#e594b4" stroke-opacity=".12"/>
  <path d="M-100 770C390 520 670 800 1140 60" fill="none" stroke="#e594b4" stroke-opacity=".09"/>
  <text x="66" y="174" class="accent" font-size="14" font-weight="700" letter-spacing="2.6">BTC / USD TRACKER</text>
  <text x="62" y="251" font-size="57" font-weight="700" letter-spacing="-1.7">Bitcoin, at a glance.</text>
  <text x="64" y="315" font-size="49" font-weight="400" letter-spacing="-1.3">More in a click.</text>
  <text x="66" y="372" class="muted" font-size="20">Live price in your top bar.</text>
  <text x="66" y="403" class="muted" font-size="20">Market charts and network data, one click away.</text>
  <rect x="66" y="452" width="259" height="89" rx="13" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".10"/>
  <text x="86" y="484" font-size="16" font-weight="700">Market</text>
  <text x="86" y="514" class="muted" font-size="15">1H · 24H · 7D price charts</text>
  <rect x="339" y="452" width="280" height="89" rx="13" fill="#ffffff" fill-opacity=".045" stroke="#ffffff" stroke-opacity=".10"/>
  <text x="359" y="484" font-size="16" font-weight="700">Network</text>
  <text x="359" y="514" class="muted" font-size="15">Fee estimates · pending blocks</text>
  <text x="66" y="605" class="accent" font-size="14">Wayland</text>
  <text x="139" y="605" class="muted" font-size="14">·</text>
  <text x="155" y="605" class="muted" font-size="14">No API keys</text>
  <text x="255" y="605" class="muted" font-size="14">·</text>
  <text x="271" y="605" class="muted" font-size="14">Automatic indicator fallback</text>
</svg>
